    <path d="M 23 48 C 21 34 26 12 32 12 C 38 12 43 34 41 48 C 39 42 36 32 32 26 C 28 32 25 42 23 48 Z" fill="url(#favRibbonGrad)" opacity="0.95"/>
    <!-- Left loop cross -->
    <path d="M 18 52 C 26 38 32 26 32 26 C 36 20 42 12 32 12 C 24 12 20 28 18 52 Z" fill="url(#favRibbonGrad)" />
    <!-- Right leg fold -->
    <path d="M 46 52 C 38 38 32 26 32 26 C 28 20 22 12 32 12 C 40 12 44 28 46 52 Z" fill="url(#favRibbonGrad)" opacity="0.85"/>
  </g>
</svg>
