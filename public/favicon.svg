<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favRibbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF65A3"/>
      <stop offset="45%" stop-color="#E0157A"/>
      <stop offset="100%" stop-color="#9D174D"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#EC4899" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#FFF1F6" />
  <!-- Realistic Pink Ribbon loop -->
  <g filter="url(#favGlow)">
